<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Category - omggame.store</title>
    <meta name="description" id="pageDescription" content="Browse free online games by category at omggame.store.">
    <meta name="robots" content="index, follow">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5952610108839991" crossorigin="anonymous"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#6366f1', light: '#818cf8', dark: '#4f46e5' },
                        accent: '#f59e0b',
                        surface: '#1e1b4b',
                        bg: '#0f0d1f'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg: #0f0d1f;
            --surface: #1e1b4b;
            --brand: #6366f1;
            --accent: #f59e0b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .game-card {
            background: var(--surface);
            border: 1px solid rgba(99,102,241,0.15);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--brand);
            box-shadow: 0 8px 30px rgba(99,102,241,0.2);
        }
        .game-card:hover .cover-play-btn {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1.1) !important;
        }
        .game-card-cover {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .ad-slot {
            background: rgba(30,27,75,0.6);
            border: 1px dashed rgba(99,102,241,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .star { color: var(--accent); }
    </style>
</head>
<body>
    <!-- Header -->
    <header style="background: var(--surface); border-bottom: 1px solid rgba(99,102,241,0.15); position: sticky; top: 0; z-index: 50;">
        <div style="max-width: 1280px; margin: 0 auto; padding: 0 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0;">
                <a href="/" style="font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none;">
                    🎮 <span style="color: var(--brand);">omg</span>game.store
                </a>
                <nav style="display: flex; gap: 24px; font-size: 14px;">
                    <a href="/#categories" style="color: var(--text-muted); text-decoration: none;">Categories</a>
                    <a href="/#popular" style="color: var(--text-muted); text-decoration: none;">Popular</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Category Content -->
    <main style="max-width: 1280px; margin: 0 auto; padding: 32px 20px;">
        <div style="margin-bottom: 32px;">
            <h1 id="categoryTitle" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 8px;">Loading...</h1>
            <p id="categoryDescription" style="color: var(--text-muted); font-size: 16px;"></p>
        </div>

        <!-- Ad above grid -->
        <div class="ad-slot" style="margin-bottom: 24px;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5952610108839991"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- Game Grid -->
        <div id="gameGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;"></div>

        <!-- Bottom Ad -->
        <div class="ad-slot" style="margin-top: 32px;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5952610108839991"
                 data-ad-slot="1234567892"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background: var(--surface); border-top: 1px solid rgba(99,102,241,0.15); padding: 32px 20px; text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 40px;">
        <div style="max-width: 1280px; margin: 0 auto;">
            <p style="margin-bottom: 8px;"><strong style="color: white;">🎮 omggame.store</strong> — Free Online Games Collection</p>
            <p>&copy; 2024 omggame.store | <a href="/privacy.html" style="color: var(--text-muted);">Privacy Policy</a> | <a href="/about.html" style="color: var(--text-muted);">About</a></p>
        </div>
    </footer>

    <script src="/assets/js/cover.js"></script>
    <script>
    const params = new URLSearchParams(window.location.search);
    const categorySlug = params.get('cat') || 'action';

    const CATEGORY_META = {
        action: { name: 'Action Games', desc: 'Fast-paced action, combat, and shooting games. Choose your weapon and dive into battle!', icon: '⚔️' },
        adventure: { name: 'Adventure Games', desc: 'Epic quests, thrilling journeys, and exciting exploration await!', icon: '🗺️' },
        puzzle: { name: 'Puzzle Games', desc: 'Brain teasers, logic puzzles, and mind-bending challenges to sharpen your thinking!', icon: '🧩' },
        racing: { name: 'Racing Games', desc: 'Hit the track! Drift, race, and speed through the best car and motorcycle games.', icon: '🏎️' },
        sports: { name: 'Sports Games', desc: 'Score big with football, basketball, pool, and more sports action!', icon: '⚽' },
        arcade: { name: 'Arcade Games', desc: 'Classic arcade fun — pick up and play instantly with simple, addictive gameplay!', icon: '🕹️' },
        sandbox: { name: 'Sandbox Games', desc: 'Build, create, and explore open worlds with unlimited creative freedom!', icon: '🏗️' },
        simulation: { name: 'Simulation Games', desc: 'Experience realistic simulators — fly planes, drive trucks, and live virtual lives!', icon: '✈️' },
        strategy: { name: 'Strategy Games', desc: 'Plan, build, and conquer! Tower defense, tactical battles, and brain-challenging strategy games.', icon: '🏰' }
    };

    async function loadCategory() {
        try {
            const res = await fetch('/data/games.json');
            const games = await res.json();
            const meta = CATEGORY_META[categorySlug] || { name: categorySlug + ' Games', desc: 'Free online ' + categorySlug + ' games.', icon: '🎮' };
            const filtered = games.filter(g => g.category === categorySlug);

            document.title = `${meta.name} - Play Free Online | omggame.store`;
            document.getElementById('pageTitle').textContent = document.title;
            document.getElementById('pageDescription').setAttribute('content', meta.desc);
            document.getElementById('categoryTitle').textContent = meta.icon + ' ' + meta.name;
            document.getElementById('categoryDescription').textContent = meta.desc + ` (${filtered.length} games)`;

            const grid = document.getElementById('gameGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 60px 0;">No games in this category yet. <a href="/" style="color: var(--brand);">Browse all games →</a></p>`;
                return;
            }

            grid.innerHTML = filtered.map(g => `
                <a href="/play/?game=${g.slug}" class="game-card">
                    ${genCover(g)}
                    <div style="padding: 14px;">
                        <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${g.shortDescription}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px;">
                            <span class="star">★ ${g.rating}</span>
                            <span style="background: rgba(99,102,241,0.2); color: #a5b4fc; padding: 2px 10px; border-radius: 12px;">${g.difficulty}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        } catch (err) {
            console.error('Failed to load category:', err);
        }
    }

    function getCategoryEmoji(cat) {
        const map = { action: '⚔️', adventure: '🗺️', puzzle: '🧩', racing: '🏎️', sports: '⚽', arcade: '🕹️', sandbox: '🏗️' };
        return map[cat] || '🎮';
    }

    loadCategory();
    </script>
</body>
</html>
